name: Screenshot Rust installer
on:
  push:
    branches: [rust-edition]
    paths: ['rust/**', '.github/workflows/rust-installer.yml']
concurrency:
  group: screenshot-native-installer-rust-edition
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust application and installer
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --manifest-path rust/Cargo.toml --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw 'Rust application build failed' }
          $pin = Get-Content installer-core.json -Raw | ConvertFrom-Json
          git init installer-reference
          git -C installer-reference fetch --depth 1 "https://github.com/$($pin.repository).git" $pin.commit
          if ($LASTEXITCODE) { throw 'Installer assets fetch failed' }
          git -C installer-reference checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Installer assets checkout failed' }
          $payload = 'rust/setup/payload'
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item installer-reference/installer-core/adapters/screenshot/ribbon.png "$payload/ribbon.png"
          rustc --edition 2024 --target x86_64-pc-windows-msvc -C opt-level=z -C target-feature=+crt-static rust/setup/cleanup.rs -o "$payload/cleanup.exe"
          if ($LASTEXITCODE) { throw 'Rust uninstaller cleanup build failed' }
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/screenshot-re.exe "$payload/Screenshot.exe"
          Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile "$payload/vc_redist.x64.exe"
          $signature = Get-AuthenticodeSignature "$payload/vc_redist.x64.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') { throw 'Microsoft runtime signature verification failed' }
          cargo build --manifest-path rust/setup/Cargo.toml --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw 'Rust installer build failed' }
          Copy-Item rust/setup/target/x86_64-pc-windows-msvc/release/screenshot-setup-re.exe Screenshot-1.8.7-RE-Setup-x64.exe
      - name: Verify installer artwork and embedded application
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE) { throw 'Pillow installation failed' }
          python scripts/verify_icon.py assets/Screenshot-installer.ico Screenshot-1.8.7-RE-Setup-x64.exe
          if ($LASTEXITCODE) { throw 'Installer icon verification failed' }
          python scripts/verify_icon.py assets/Screenshot.ico rust/setup/payload/Screenshot.exe
          if ($LASTEXITCODE) { throw 'Application icon verification failed' }
          $p = Start-Process rust/setup/payload/Screenshot.exe -ArgumentList '--self-test-output' -Wait -PassThru
          if ($p.ExitCode) { throw 'Application PNG and clipboard check failed' }
      - name: Exercise the real installer and uninstaller
        run: |
          cargo tree --manifest-path rust/setup/Cargo.toml --locked | Tee-Object -Variable dependencies
          if ($LASTEXITCODE -or ($dependencies -match 'wry|webview2|tao')) { throw 'Installer dependencies check failed' }
          python rust/setup/test-windows.py
          if ($LASTEXITCODE) { throw 'Installer lifecycle check failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-1.8.7-RE-Setup-x64
          path: |
            Screenshot-1.8.7-RE-Setup-x64.exe
            installer-review
      - name: Publish installer for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'Screenshot-1.8.7-RE-Setup-x64.exe'
          gh release view v1.8.7-re --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.8.7-re $asset --clobber
            if ($LASTEXITCODE -eq 0) { exit 0 }
          } else {
            git push origin "${env:GITHUB_SHA}:refs/tags/v1.8.7-re"
            if ($LASTEXITCODE -eq 0) {
              gh release create v1.8.7-re $asset --verify-tag --prerelease --latest=false --title 'Screenshot v1.8.7 RE' --notes 'Native Rust installer and application for Windows x64.'
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
          }
          # GitHub can restrict Releases independently of the branch. Keep the
          # verified EXE downloadable from a dedicated branch in that case.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $asset
          if ($LASTEXITCODE) { throw 'Could not stage verified installer' }
          git commit -m 'Publish verified Screenshot 1.8.7 RE installer'
          if ($LASTEXITCODE) { throw 'Could not commit verified installer' }
          git push origin HEAD:refs/heads/release/screenshot-1.8.7-re
          if ($LASTEXITCODE) { throw 'GitHub rejected installer publication' }
