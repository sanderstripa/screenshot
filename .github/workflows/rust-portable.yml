name: Screenshot Rust portable
on:
  push:
    branches: [rust-edition]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-portable.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Windows x64
        working-directory: rust
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "Rust target setup failed" }
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "Rust tests failed" }
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "Rust release build failed" }
      - name: Verify packaged application
        run: |
          $exe = 'rust/target/x86_64-pc-windows-msvc/release/screenshot-re.exe'
          foreach ($arg in @('--self-test', '--self-test-output')) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode) { throw "Executable test $arg failed with $($p.ExitCode)" }
          }
          python -m pip install Pillow
          if ($LASTEXITCODE) { throw "Pillow installation failed" }
          python scripts/verify_icon.py assets/Screenshot.ico $exe
          if ($LASTEXITCODE) { throw "Embedded icon verification failed" }
          python scripts/test_settings_render.py $exe test-results/settings-render
          if ($LASTEXITCODE) { throw "Settings rendering verification failed" }
          python scripts/test_capture.py $exe test-results/capture
          if ($LASTEXITCODE) { throw "Window and region capture verification failed" }
      - name: Package portable ZIP
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/screenshot-re.exe portable/Screenshot.exe
          Copy-Item LICENSE portable/LICENSE.txt
          Copy-Item assets/fonts/OFL.txt portable/Montserrat-OFL.txt
          Compress-Archive -Path portable/* -DestinationPath Screenshot-v1.8.5-RE-Portable-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-RE-Windows-review
          path: |
            Screenshot-v1.8.5-RE-Portable-x64.zip
            test-results/settings-render
            test-results/capture
      - name: Publish candidate for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.8.5-re Screenshot-v1.8.5-RE-Portable-x64.zip --target $env:GITHUB_SHA --prerelease --latest=false --title 'Screenshot v1.8.5 RE' --notes 'Portable Rust build for Windows x64. Extract the ZIP and run Screenshot.exe.'
          if ($LASTEXITCODE) { throw "Portable release upload failed" }
