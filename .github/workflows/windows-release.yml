name: Screenshot Windows release
on:
  push:
    branches: [main, codex/screenshot-installer-soulu-appearance]
    paths-ignore: [release-candidate.json, '.github/workflows/publish-verified.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify approved SVG geometry
        shell: pwsh
        run: |
          ./scripts/generate_settings_icon.ps1
          ./scripts/generate_theme_icons.ps1
          git diff --exit-code -- src/approved_settings_icon.h src/vpn_theme_icons.h
          if ($LASTEXITCODE -ne 0) { throw "Generated icon differs from the approved SVG" }
      - name: Configure x64 native Windows
        run: cmake -S . -B build -A x64
      - name: Compile screenshot app
        run: cmake --build build --config Release --target Screenshot
      - name: Verify screenshot PNG encoding
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Image test failed: $($p.ExitCode)" }




      - name: Build and verify shared CONNECT Installer
        shell: pwsh
        run: |
          ./scripts/build-connect-installer.ps1 -PayloadPath "$PWD/build/Release/Screenshot.exe" -Version '1.8.2' -OutFile "$PWD/build/Release/Screenshot-1.8.2-Release-x64.exe" -TestUI
      - name: Verify installer appearance and unchanged layout
        shell: pwsh
        run: node scripts/test-installer-appearance.cjs
      - name: Verify all embedded application and installer icon sizes
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/verify_icon.py assets/Screenshot.ico build/Release/Screenshot-1.8.2-Release-x64.exe build/Release/Screenshot.exe
          if($LASTEXITCODE){throw 'Embedded icon verification failed'}
      - name: Verify visible settings in both themes
        run: python scripts/test_settings_render.py build/Release/Screenshot.exe test-results/settings-render
      - name: Verify actual saved PNG and clipboard
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot.exe" -ArgumentList "--self-test-output" -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "PNG disk and clipboard test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-UI-review
          path: |
            test-results/settings-render
            test-results/installer-appearance
            .tmp/installer-review
      - name: Build release payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item ".\build\Release\Screenshot-1.8.2-Release-x64.exe" ".\dist\Screenshot-1.8.2-Release-x64.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Windows-x64
          path: dist/Screenshot-1.8.2-Release-x64.exe
      - name: Publish verified 1.8.2 Connect interface
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.8.2 *> $null
          $releaseExists=($LASTEXITCODE -eq 0)
          $files = @('dist/Screenshot-1.8.2-Release-x64.exe')
          $sums = foreach ($file in $files) { "$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
          if($releaseExists){
            gh release upload v1.8.2 dist/Screenshot-1.8.2-Release-x64.exe SHA256SUMS.txt --clobber
            if($LASTEXITCODE){throw 'Updated installer upload failed'}
            gh api -X PATCH repos/sanderstripa/screenshot/git/refs/tags/v1.8.2 -f sha=$env:GITHUB_SHA -F force=true
            if($LASTEXITCODE){throw 'Release tag update failed'}
            gh release edit v1.8.2 --notes-file RELEASE_NOTES.md --latest
          }else{
            gh release create v1.8.2 dist/Screenshot-1.8.2-Release-x64.exe SHA256SUMS.txt --target $env:GITHUB_SHA --latest --title 'Screenshot v1.8.2' --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Verified release publication failed' }
