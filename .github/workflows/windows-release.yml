name: Screenshot Windows release
on:
  push:
    branches: [main, connect-ui-v1-screenshot-buttons]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved SVG geometry
        shell: pwsh
        run: |
          ./scripts/generate_settings_icon.ps1
          ./scripts/generate_theme_icons.ps1
          git diff --exit-code -- src/approved_settings_icon.h src/vpn_theme_icons.h
          if ($LASTEXITCODE -ne 0) { throw "Generated icon differs from the approved SVG" }
      - name: Configure x64 native Windows
        run: cmake -S . -B build -A x64
      - name: Compile screenshot app
        run: cmake --build build --config Release --target Screenshot
      - name: Verify screenshot PNG encoding
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Image test failed: $($p.ExitCode)" }
      - name: Build native custom installer (no Inno)
        run: cmake --build build --config Release --target ScreenshotSetup
      - name: Verify embedded executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot-Setup.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Embedded payload invalid: $($p.ExitCode)" }
      - name: Install twice to test both clean install and updating an existing version
        shell: pwsh
        run: |
          for ($i=1; $i -le 2; $i++) {
            $p = Start-Process -FilePath ".\build\Release\Screenshot-Setup.exe" -ArgumentList "--integration-test" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Install or upgrade attempt $i failed: $($p.ExitCode)" }
            if (!(Test-Path "$env:LOCALAPPDATA\Programs\Screenshot\Screenshot.exe")) { throw "App missing after attempt $i" }
            if (!(Test-Path "$env:LOCALAPPDATA\Programs\Screenshot\Uninstall.exe")) { throw "Uninstaller missing after attempt $i" }
          }
          $expected = (Get-FileHash ".\build\Release\Screenshot.exe").Hash
          $installed = (Get-FileHash "$env:LOCALAPPDATA\Programs\Screenshot\Screenshot.exe").Hash
          if ($expected -ne $installed) { throw "Installed exe mismatch" }
          $app = "$env:LOCALAPPDATA\Programs\Screenshot\Screenshot.exe"
          $child = Start-Process -FilePath $app -ArgumentList "--hold-install-test" -PassThru
          Start-Sleep -Seconds 2
          if ($child.HasExited) { throw "Upgrade test process exited unexpectedly" }
          $upgrade = Start-Process -FilePath ".\build\Release\Screenshot-Setup.exe" -ArgumentList "--integration-test" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Update over running Screenshot failed: $($upgrade.ExitCode)" }
          $child.WaitForExit(10000) | Out-Null
          if (!$child.HasExited) { Stop-Process -Id $child.Id -Force; throw "Old screenshot did not exit" }
          if ((Get-FileHash $app).Hash -ne $expected) { throw "Upgrade binary differs" }
      - name: Verify Windows autostart registration and clean uninstall
        shell: pwsh
        run: |
          $launch = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").Screenshot
          if (!$launch.Contains("Screenshot.exe")) { throw "Autostart registration invalid" }
          if (!$launch.Contains("--background")) { throw "Login startup must stay in the background" }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) 'Screenshot.lnk'
          if (!(Test-Path -LiteralPath $shortcutPath)) { throw "Start menu shortcut missing" }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          if ($shortcut.Arguments -ne '--settings' -or $shortcut.TargetPath -ne "$env:LOCALAPPDATA\Programs\Screenshot\Screenshot.exe") {
            throw "Start menu must open the application settings"
          }
          $uninst = "$env:LOCALAPPDATA\Programs\Screenshot\Uninstall.exe"
          $remove = Start-Process -FilePath $uninst -ArgumentList "--uninstall" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed: $($remove.ExitCode)" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Screenshot\Screenshot.exe") {
            throw "Executable remains after uninstall"
          }
          if (Test-Path -LiteralPath $shortcutPath) { throw "Start menu shortcut remains after uninstall" }
      - name: Verify actual saved PNG and clipboard
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot.exe" -ArgumentList "--self-test-output" -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "PNG disk and clipboard test failed: $($p.ExitCode)" }
      - name: Build release payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item ".\build\Release\Screenshot-Setup.exe" ".\dist\Screenshot-Setup.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Windows-x64
          path: dist/Screenshot-Setup.exe
      - name: Publish only after checks are green
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.9-rc.2 --repo "${{ github.repository }}" --pattern Screenshot-Setup.exe --dir verified-release
          if ($LASTEXITCODE -ne 0) { throw "Tested candidate download failed" }
          $expected = "d3b1acd89a3383418955ec6e650320301de5f9bf7be52cbb369589d967175be0"
          if ((Get-FileHash verified-release/Screenshot-Setup.exe).Hash.ToLowerInvariant() -ne $expected) { throw "Tested candidate hash mismatch" }
          Copy-Item verified-release/Screenshot-Setup.exe dist/Screenshot-Setup.exe -Force
          $tag = "v0.6.9"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "dist/Screenshot-Setup.exe" `
              --repo "${{ github.repository }}" `
              --title "Screenshot v0.6.9" `
              --notes-file "RELEASE_NOTES.md" `
              --target "${{ github.sha }}" `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "Release publish failed" }
          }

