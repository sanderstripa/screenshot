name: Screenshot Windows release
on:
  push:
    branches: [main, connect-ui-v1-screenshot-buttons]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify approved SVG geometry
        shell: pwsh
        run: |
          ./scripts/generate_settings_icon.ps1
          ./scripts/generate_theme_icons.ps1
          git diff --exit-code -- src/approved_settings_icon.h src/vpn_theme_icons.h
          if ($LASTEXITCODE -ne 0) { throw "Generated icon differs from the approved SVG" }
      - name: Configure x64 native Windows
        run: cmake -S . -B build -A x64
      - name: Compile screenshot app
        run: cmake --build build --config Release --target Screenshot
      - name: Verify screenshot PNG encoding
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Image test failed: $($p.ExitCode)" }




      - name: Build and verify shared CONNECT Installer
        shell: pwsh
        run: |
          ./scripts/build-connect-installer.ps1 -PayloadPath "$PWD/build/Release/Screenshot.exe" -Version '0.7.3' -OutFile "$PWD/build/Release/Screenshot-Setup.exe" -TestUI
      - name: Verify all embedded application and installer icon sizes
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/verify_icon.py assets/Screenshot.ico build/Release/Screenshot-Setup.exe build/Release/Screenshot.exe
          if($LASTEXITCODE){throw 'Embedded icon verification failed'}
      - name: Verify actual saved PNG and clipboard
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot.exe" -ArgumentList "--self-test-output" -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "PNG disk and clipboard test failed: $($p.ExitCode)" }
      - name: Build release payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item ".\build\Release\Screenshot-Setup.exe" ".\dist\Screenshot-Setup.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Windows-x64
          path: dist/Screenshot-Setup.exe
      - name: Publish only after checks are green
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.7.3-rc.2 --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){
            gh release create v0.7.3-rc.2 dist/Screenshot-Setup.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Screenshot v0.7.3-rc.2' --notes-file RELEASE_NOTES.md --prerelease
            if($LASTEXITCODE){throw 'Release publication failed'}
          }
