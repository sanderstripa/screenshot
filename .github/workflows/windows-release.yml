name: Screenshot Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Generate approved multi-resolution Screenshot icon
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          python scripts/make_icon.py assets
          if (!(Test-Path assets\Screenshot.ico)) { throw "Icon generation failed" }
      - name: Configure x64 native Windows
        run: cmake -S . -B build -A x64
      - name: Compile screenshot app
        run: cmake --build build --config Release --target Screenshot
      - name: Verify screenshot PNG encoding
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Image test failed: $($p.ExitCode)" }
      - name: Build native custom installer (no Inno)
        run: cmake --build build --config Release --target ScreenshotSetup
      - name: Verify embedded executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\Release\Screenshot-Setup.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Embedded payload invalid: $($p.ExitCode)" }
      - name: Install twice to test both clean install and updating an existing version
        shell: pwsh
        run: |
          for ($i=1; $i -le 2; $i++) {
            $p = Start-Process -FilePath ".\build\Release\Screenshot-Setup.exe" -ArgumentList "--integration-test" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Install or upgrade attempt $i failed: $($p.ExitCode)" }
            if (!(Test-Path "$env:LOCALAPPDATA\Programs\Screenshot\Screenshot.exe")) { throw "App missing after attempt $i" }
            if (!(Test-Path "$env:LOCALAPPDATA\Programs\Screenshot\Uninstall.exe")) { throw "Uninstaller missing after attempt $i" }
          }
          $expected = (Get-FileHash ".\build\Release\Screenshot.exe").Hash
          $installed = (Get-FileHash "$env:LOCALAPPDATA\Programs\Screenshot\Screenshot.exe").Hash
          if ($expected -ne $installed) { throw "Installed exe mismatch" }
          $app = "$env:LOCALAPPDATA\Programs\Screenshot\Screenshot.exe"
          $child = Start-Process -FilePath $app -ArgumentList "--hold-install-test" -PassThru
          Start-Sleep -Seconds 2
          if ($child.HasExited) { throw "Upgrade test process exited unexpectedly" }
          $upgrade = Start-Process -FilePath ".\build\Release\Screenshot-Setup.exe" -ArgumentList "--integration-test" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Update over running Screenshot failed: $($upgrade.ExitCode)" }
          $child.WaitForExit(10000) | Out-Null
          if (!$child.HasExited) { Stop-Process -Id $child.Id -Force; throw "Old screenshot did not exit" }
          if ((Get-FileHash $app).Hash -ne $expected) { throw "Upgrade binary differs" }
      - name: Build release payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item ".\build\Release\Screenshot-Setup.exe" ".\dist\Screenshot-Setup.exe" -Force
      - name: Publish only after checks are green
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.0"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "dist/Screenshot-Setup.exe" `
              --repo "${{ github.repository }}" `
              --title "Screenshot v0.3.0" `
              --notes-file "RELEASE_NOTES.md" `
              --target "${{ github.sha }}" `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "Release publish failed" }
          }
