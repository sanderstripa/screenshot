name: Settings rendering regression
on:
  pull_request:
    paths: ['src/**', 'scripts/test_settings_render.py', '.github/workflows/settings-render.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --target Screenshot
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/test_settings_render.py build/Release/Screenshot.exe test-results/settings-render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-settings-fix
          path: |
            build/Release/Screenshot.exe
            test-results/settings-render
