<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screenshot</title><link rel="stylesheet" href="connect.css"><link rel="stylesheet" href="screenshot.css"></head><body><div class="shell"><header><div class="tools"><button id="minimize" aria-label="Свернуть">−</button><button id="close" aria-label="Закрыть">×</button></div></header><main>
<section id="welcome" class="welcome"><div class="intro"><p id="eyebrow" class="eyebrow"></p><h1>Screenshot</h1><button id="primary" class="primary"></button><button id="settingsButton" class="text-button"></button></div><img class="ribbon" src="assets/mobius.png" alt=""></section>
<section id="settings" hidden><div class="settings-heading"><h2 id="settingsTitle"></h2><button id="back" class="text-button"></button></div><div class="setting-line"><span id="languageLabel"></span><div class="choices"><button id="ru">RU</button><button id="en">EN</button></div><span id="themeLabel"></span><div class="choices"><button id="light"></button><button id="dark"></button></div></div><label id="pathLabel" for="path"></label><div id="pathRow" class="path-line"><input id="path" spellcheck="false"><button id="browse" class="outlined"></button></div><label class="switch-row"><input id="desktop" type="checkbox" role="switch" checked><span class="switch"></span><span id="desktopLabel"></span></label><label class="switch-row"><input id="startMenu" type="checkbox" role="switch" checked><span class="switch"></span><span id="menuLabel"></span></label><button id="accept" class="primary"></button></section>
<section id="installing" hidden><img class="progress-ribbon" src="assets/mobius.png" alt=""><div class="progress-bottom"><progress id="progress" max="100" value="0"></progress><p id="status" role="status"></p></div></section>
<section id="installed" class="result" hidden><h1>Screenshot</h1><p id="success"></p><button id="continue" class="primary"></button><p id="nextHint" class="hint"></p></section>
<section id="hotkey" hidden><h2 id="hotkeyTitle"></h2><p id="hotkeyHint" class="description"></p><button id="keyField" class="key-field"></button><button id="next" class="primary"></button></section>
<section id="confirm" hidden><p class="eyebrow">PRINT SCREEN</p><h2 id="confirmTitle"></h2><p id="confirmHint" class="description"></p><div class="actions"><button id="cancel" class="outlined"></button><button id="replace" class="primary"></button></div></section>
<section id="finish" hidden><h1>Screenshot</h1><p id="readyTitle"></p><div class="finish-details"><p id="shortcutInfo"></p><p id="saveInfo" class="hint"></p></div><button id="done" class="primary"></button><label id="launchRow" class="switch-row"><input id="launch" type="checkbox" role="switch" checked><span class="switch"></span><span id="launchLabel"></span></label></section>
<div id="failure" hidden><p id="error" role="alert"></p><button id="retry" class="text-button"></button></div><div id="notice" hidden role="dialog" aria-modal="true"><h2 id="noticeTitle"></h2><p id="noticeText"></p><button id="noticeOk" class="primary">OK</button></div>
</main><footer><span>by CONNECT.</span><span id="version"></span></footer></div><script src="setup.js"></script></body></html>
